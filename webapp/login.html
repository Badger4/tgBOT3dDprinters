<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Farm Manager — Вхід у систему</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Modular Auth CSS -->
    <link rel="stylesheet" href="/static/css/auth.css?v=2000">
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">
                <i class="fa-solid fa-cubes"></i>
            </div>
            <h1 class="login-title">3D Farm Manager</h1>
            <p class="login-subtitle">Введіть майстер-пароль адміністратора для входу у веб-панель</p>
        </div>

        <div id="login-alert" class="login-alert"></div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group mb-3">
                <label for="password-input">🔑 Майстер-пароль / Ключ доступу</label>
                <div class="pass-wrap">
                    <input type="password" id="password-input" class="form-control" placeholder="Введіть пароль..." required autofocus>
                    <button type="button" class="pass-toggle" onclick="togglePassVisibility()">
                        <i id="pass-icon" class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="login-btn" class="btn btn-primary w-100 mt-2">
                <i class="fa-solid fa-right-to-bracket me-2"></i> Увійти в систему
            </button>
        </form>

        <div style="text-align: center; margin-top: 10px;">
            <a href="/setup" style="color: #6366f1; font-size: 12px; text-decoration: none;">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Перший запуск? Майстер налаштування (Setup Wizard)
            </a>
        </div>
    </div>

    <!-- Modular Login JS -->
    <script src="/static/js/login.js?v=2000"></script>
</body>
</html>
