<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Farm Manager — Майстер початкового налаштування</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Modular Auth CSS -->
    <link rel="stylesheet" href="/static/css/auth.css?v=2000">
</head>
<body>
    <div class="setup-card">
        <div class="setup-header">
            <div class="setup-logo">
                <i class="fa-solid fa-sliders"></i>
            </div>
            <h1 class="setup-title">Майстер Налаштування</h1>
            <p class="setup-subtitle">Швидка первинна ініціалізація вашої 3D-ферми</p>
        </div>

        <div id="setup-alert" class="setup-alert"></div>

        <form id="setup-form" onsubmit="handleSetup(event)">
            <div class="form-group mb-3">
                <label for="admin-pass-input">🔑 Новий пароль адміністратора веб-панелі *</label>
                <input type="password" id="admin-pass-input" class="form-control" placeholder="Вкажіть надійний пароль..." required autofocus>
            </div>

            <div class="form-group mb-3">
                <label for="bot-token-input">🤖 Telegram Bot Token (опціонально)</label>
                <input type="text" id="bot-token-input" class="form-control" placeholder="7560551210:AAFZHgttlDYCTa2whQlrz-8RvjCrPpynWu0">
            </div>

            <div class="form-group mb-3">
                <label for="admin-chat-id-input">💬 Telegram Chat ID адміністратора (опціонально)</label>
                <input type="text" id="admin-chat-id-input" class="form-control" placeholder="Ваш цифровий Telegram ID (напр. 123456789)">
            </div>

            <div class="form-group mb-3">
                <label for="electricity-cost-input">⚡ Вартість електроенергії (грн/кВт·год)</label>
                <input type="number" step="0.01" id="electricity-cost-input" class="form-control" placeholder="4.32">
            </div>

            <button type="submit" id="setup-btn" class="btn btn-primary w-100 mt-2">
                <i class="fa-solid fa-check me-2"></i> Завершити Налаштування та Увійти
            </button>
        </form>

        <div style="text-align: center; margin-top: 10px;">
            <a href="/login" style="color: #6366f1; font-size: 12px; text-decoration: none;">
                <i class="fa-solid fa-arrow-left"></i> Повернутися до сторінки входу
            </a>
        </div>
    </div>

    <!-- Modular Setup JS -->
    <script src="/static/js/setup.js?v=2000"></script>
</body>
</html>
