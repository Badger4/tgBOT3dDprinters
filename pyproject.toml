[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "3d-printer-farm-bot"
version = "2.0.0"
description = "Telegram Bot and WebApp for Bambu Lab 3D Printer Farm Fleet Management"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "3D Farm Team"}
]
dependencies = [
    "aiogram>=3.0.0",
    "paho-mqtt>=1.6.1",
    "python-dotenv>=1.0.0",
    "aiofiles>=23.2.1",
    "Pillow>=12.3.0",
    "reportlab>=4.0.0",
    "google-genai>=0.1.0",
    "setuptools>=83.0.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
    "pytest-rerunfailures>=12.0",
    "pytest-cov>=4.0.0",
    "paramiko>=3.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
printer-farm = "main:main"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-ra --reruns 2 --reruns-delay 1"
filterwarnings = [
    "ignore::DeprecationWarning:aiohttp.*",
    "ignore::aiohttp.web_exceptions.NotAppKeyWarning"
]

[tool.coverage.run]
source = [
    "models",
    "services",
    "storage",
    "config",
    "utils"
]
omit = [
    "tests/*",
    "scripts/*",
    "webapp/*",
    "main.py",
    "app.py"
]

[tool.coverage.report]
fail_under = 65
show_missing = true
precision = 2
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "\\.\\.\\."
]

[tool.coverage.json]
output = "coverage.json"
pretty_print = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    "printers_storage",
    "logs",
    "webapp",
    "scratch"
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # function calls in argument defaults
    "E402", # module level import not at top of file (used after dotenv setup)
    "E731", # do not assign a lambda expression
    "UP042", # Class inherits from both str and Enum (for backwards compatibility)
    "UP038", # Use X | Y in isinstance call instead of (X, Y)
    "B007", # Loop control variable not used within loop body
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841", "F401", "B007"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
