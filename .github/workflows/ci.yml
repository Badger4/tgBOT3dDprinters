name: CI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Pytest Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov pytest-xdist pytest-rerunfailures mypy pip-audit



      - name: Run Pytest with Coverage Gate
        env:
          TELEGRAM_BOT_TOKEN: "1234567890:TEST_CI_MOCK_TOKEN_FOR_GITHUB_ACTIONS"
          ADMIN_CHAT_ID: "123456789"
          STORAGE_DIR: "./printers_storage"
        run: |
          pytest tests/ --cov=models --cov=services --cov=storage --cov=config --cov=utils --cov-fail-under=65 --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=json:coverage.json --verbose

      - name: Enforce Per-File Coverage Floors
        run: |
          python scripts/check_per_file_coverage.py coverage.json

      - name: Upload Coverage Report to Codecov
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}



      - name: Run Mypy Type Checker
        run: |
          mypy models/ services/ storage/ config.py

      - name: Audit Dependencies for CVEs
        run: |
          pip-audit
